version: 2
project_id: northwind
approval:
  status: approved
  approved_by: "Maria Chen (VP Marketing)"
  approved_at: 2026-09-12
  notes: "Approved on kickoff call; asked to start with UK manufacturing."
  content_hash: sha256:519b755c76f81410
# Core: true for every segment. Segments only add or replace what differs (`npx gtm icp` shows the result).
core:
  firmographics:
    employee_count: {min: 200, max: 1500}
    keywords_none: [holding company]
segments:
  - id: uk-manufacturing-mm
    description: UK manufacturers on mid-market ERPs
    firmographics:
      industries: [Manufacturing, Industrial Machinery, Food & Beverage Manufacturing]
      hq_countries: [GB]
      technologies_any: [Sage 200, Microsoft Dynamics NAV, SAP Business One]
  - id: dach-wholesale-mm
    description: DACH wholesale and distribution (smaller size band)
    firmographics:
      industries: [Wholesale, Distribution, Logistics]
      employee_count: {min: 200, max: 1000}
      hq_countries: [DE, AT, CH]
personas:
  - id: finance-leader
    role: decision_maker
    titles_any: [CFO, Chief Financial Officer, Finance Director, VP Finance, Head of Finance]
    titles_none: [Assistant, Intern, Interim]
    seniorities: [c_level, vp, head, director]
    departments: [Finance]
  - id: ap-owner
    role: champion
    titles_any: [Head of Accounts Payable, AP Manager, Financial Controller, Finance Operations Manager]
    titles_none: [Assistant, Intern]
    seniorities: [head, director, manager]
    departments: [Finance]
exclusions:
  domains: [competitor-one.example, competitor-two.example, competitor-three.example]
  industries: [Government, Financial Services, Banking]
