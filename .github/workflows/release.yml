name: release
# Publishes @veleads/gtm to npm with Trusted Publishing (OIDC): no npm token is stored anywhere.
# npmjs.com → @veleads/gtm → Settings → Trusted Publisher: GitHub Actions, org "Veleads",
# repo "gtm-core", workflow "release.yml", environment "npm".
# Then publishes the matching worker image ghcr.io/veleads/gtm-worker:<version> (GITHUB_TOKEN), which
# each project's stack (`npx gtm stack up`) runs. The GHCR package must be public so any machine can pull it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Environment "npm" with required reviewers: every publish waits for a human approval.
    environment: npm
    permissions:
      contents: read
      id-token: write   # OIDC token for npm Trusted Publishing (and automatic provenance)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache in the publish job: a release must not restore a cache
          # written by another workflow run (cache-poisoning risk).
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: npm CLI with Trusted Publishing support (>= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package version
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package v$v"; exit 1; }
      - name: Changelog has an entry for this version
        run: grep -q "^## \[$(node -p "require('./packages/cli/package.json').version")\]" CHANGELOG.md
      - run: pnpm check
      - run: pnpm test:e2e
      # pnpm pack rewrites workspace: dependencies; npm publish performs the OIDC exchange.
      - name: Pack
        run: cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish (OIDC, provenance generated automatically)
        run: npm publish "$RUNNER_TEMP"/veleads-gtm-*.tgz --access public

  worker-image:
    # Only after the npm publish was approved and succeeded: the image tag always has a matching CLI.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version from tag (v1.2.3 → 1.2.3, the tag `gtm stack up` pulls)
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Intel/AMD servers and Apple Silicon / ARM laptops both pull the same tag.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/veleads/gtm-worker:${{ steps.v.outputs.version }}
