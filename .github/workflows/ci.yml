name: ci
on:
  pull_request:
  push:
    branches: [main]

# Public repo: fork PRs run with a read-only token and no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: kit/schemas is up to date with packages/schemas
        run: pnpm schemas:check
      - run: pnpm test:e2e
      - name: Worker image builds (not pushed)
        run: docker build -f workers/Dockerfile -t gtm-worker:ci .
