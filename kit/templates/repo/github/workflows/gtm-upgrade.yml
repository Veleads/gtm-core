name: gtm-upgrade
# Opens a PR when a newer @veleads/gtm is published. Requires repo setting:
# Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then npx -y pnpm@10 install --frozen-lockfile
          elif [ -f yarn.lock ]; then npx -y yarn@1 install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi
      - name: Upgrade core (sync + migrate + validate)
        id: upgrade
        run: |
          before=$(node -p "require('./package.json').devDependencies['@veleads/gtm']")
          npx gtm upgrade 2>&1 | tee "$RUNNER_TEMP/upgrade.log" || true
          after=$(node -p "require('./package.json').devDependencies['@veleads/gtm']")
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
      # Commits every change the upgrade made (kit, AGENTS.md, lockfile, migrated and renamed files).
      - name: Open PR
        if: steps.upgrade.outputs.before != steps.upgrade.outputs.after
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upgrade/core-v${{ steps.upgrade.outputs.after }}
          title: "chore: core ${{ steps.upgrade.outputs.before }} → ${{ steps.upgrade.outputs.after }}"
          commit-message: "chore: core v${{ steps.upgrade.outputs.after }}"
          body-path: ${{ runner.temp }}/upgrade.log
