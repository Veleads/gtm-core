# Local stack: Postgres (gtm data + Hatchet's own database) and hatchet-lite (job engine).
#   pnpm stack:up     start, migrate the gtm database, create a Hatchet token → ~/.gtm/stack.env
#   pnpm worker       run the gtm worker on this machine (connects to the stack)
#   pnpm stack:down   stop (data kept)   ·   pnpm stack:down --wipe   stop and delete all data
# Hatchet UI: http://localhost:8888 (local default login admin@example.com / Admin123!!; local only).
services:
  postgres:
    image: postgres:16.10
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: gtm
      POSTGRES_DB: gtm
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm -d gtm"]
      interval: 2s
      timeout: 5s
      retries: 30

  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.110.5
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8888:8888", "7077:7077"]
    environment:
      DATABASE_URL: postgresql://gtm:gtm@postgres:5432/hatchet?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
    volumes:
      - hatchet_config:/config

volumes:
  pgdata:
  hatchet_config:
