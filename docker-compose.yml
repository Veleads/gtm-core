# Local dev only: Postgres (data layer) + hatchet-lite (job runner).
#   docker compose up -d     then   pnpm db:migrate
# Hatchet UI: http://localhost:8888 (create an API token there and put it in .env)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gtm
      POSTGRES_PASSWORD: gtm
      POSTGRES_DB: gtm
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm -d gtm"]
      interval: 5s
      timeout: 5s
      retries: 10

  hatchet-lite:
    # Pin to a specific tag before relying on this in shared environments.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8888:8888", "7077:7077"]
    environment:
      DATABASE_URL: postgresql://gtm:gtm@postgres:5432/hatchet?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
    volumes:
      - hatchet_config:/config

volumes:
  pgdata:
  hatchet_config:
